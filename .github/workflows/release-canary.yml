name: Release canary

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: raco pkg install torch (${{ matrix.os }}, Racket ${{ matrix.racket }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        racket: ["9.1", stable]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Is torch on the catalog
        id: catalog
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://pkgs.racket-lang.org/pkg/torch)
          if [ "$code" = 404 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::notice::torch is not on pkgs.racket-lang.org yet; nothing to check."
            echo "published=false" >>"$GITHUB_OUTPUT"
          elif [ "$code" = 200 ]; then
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::pkgs.racket-lang.org answered $code for torch."
            exit 1
          fi

      - uses: Bogdanp/setup-racket@v1.15
        if: steps.catalog.outputs.published == 'true'
        with:
          version: ${{ matrix.racket }}
          variant: CS
          distribution: full
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install from the catalog, train 04-mlp, check the package deps
        if: steps.catalog.outputs.published == 'true'
        run: |
          set -euo pipefail
          host="$RUNNER_OS $(uname -m)"
          scripts/platform/smoke-install.sh https://pkgs.racket-lang.org "$host"
