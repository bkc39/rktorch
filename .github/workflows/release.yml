name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Check as if this tag were pushed (empty: v<torch/info.rkt's version>); a dispatch never drafts a release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Versions, ABI stamp and the previous release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      native-version: ${{ steps.plan.outputs.native-version }}
      build-natives: ${{ steps.plan.outputs.build-natives }}
      natives-tag: ${{ steps.plan.outputs.natives-tag }}
      previous: ${{ steps.previous.outputs.previous }}
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
          variant: CS
          architecture: x64

      - name: The previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" >"$RUNNER_TEMP/releases.json"
          line=$(racket scripts/release/release.rkt previous "$TAG" "$RUNNER_TEMP/releases.json")
          echo "$line" | tee -a "$GITHUB_OUTPUT"
          previous=${line#previous=}
          mkdir -p "$RUNNER_TEMP/previous"
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
              --pattern manifest.json --pattern catalog-entry.rktd --dir "$RUNNER_TEMP/previous"
          fi

      - name: Check the versions and decide whether the natives build
        id: plan
        run: |
          set -euo pipefail
          manifest=()
          if [ -f "$RUNNER_TEMP/previous/manifest.json" ]; then
            manifest=("$RUNNER_TEMP/previous/manifest.json")
          fi
          racket scripts/release/release.rkt plan "$TAG" "${manifest[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Keep the previous release's manifest and entries
        uses: actions/upload-artifact@v4
        with:
          name: release-previous
          path: ${{ runner.temp }}/previous/
          if-no-files-found: ignore

  linux:
    needs: plan
    if: needs.plan.outputs.build-natives == 'true'
    uses: ./.github/workflows/platform-linux.yml

  macos:
    needs: plan
    if: needs.plan.outputs.build-natives == 'true'
    uses: ./.github/workflows/platform-macos.yml

  draft:
    name: Assemble the assets and draft the release
    needs: [plan, linux, macos]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && (needs.plan.outputs.build-natives == 'false'
          || (needs.linux.result == 'success' && needs.macos.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      BUILD_NATIVES: ${{ needs.plan.outputs.build-natives }}
    steps:
      - uses: actions/checkout@v5

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
          variant: CS
          architecture: x64

      - name: Download the platform packages
        if: needs.plan.outputs.build-natives == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: torch-*
          path: ${{ runner.temp }}/artifacts

      - name: Download the previous release's manifest and entries
        if: needs.plan.outputs.build-natives == 'false'
        uses: actions/download-artifact@v4
        with:
          name: release-previous
          path: ${{ runner.temp }}/previous

      - name: Fetch the LGPL sources
        if: needs.plan.outputs.build-natives == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < <(racket scripts/release/release.rkt lgpl-sources)
          scripts/platform/fetch.sh "$RUNNER_TEMP/sources" "${files[@]}"

      - name: Assemble
        run: |
          set -euo pipefail
          natives=(--previous "$RUNNER_TEMP/previous")
          if [ "$BUILD_NATIVES" = true ]; then natives=(--artifacts "$RUNNER_TEMP/artifacts"); fi
          mkdir -p "$RUNNER_TEMP/sources"
          racket scripts/release/release.rkt assemble --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            "${natives[@]}" --sources "$RUNNER_TEMP/sources" \
            --notes "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          cat "$RUNNER_TEMP/dist/manifest.json"
          (cd "$RUNNER_TEMP/dist" && sha256sum --check SHA256SUMS)

      - name: Attest the build provenance
        id: attest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/dist/*

      - name: Add the provenance bundle
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/dist/provenance.sigstore.json"

      - name: Upload the assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/notes.md

      - name: Draft the release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG exists already. Delete the draft to rebuild it; a published release is never replaced."
            exit 1
          fi
          prerelease=()
          case $TAG in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            "${prerelease[@]}" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/dist/*
