name: Nix checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - name: Build, test, and lint
        run: nix flake check --print-build-logs

  # The same gates run inside `nix flake check` above; building the lint
  # derivations as separate named steps attributes a failure to the specific
  # tool (format vs tidy vs line gate) without digging through flake logs.
  # Ordered cheapest-first so format errors fail in seconds.
  cpp-lint:
    name: C++ lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - name: clang-format
        run: nix build .#cpp-format --print-build-logs
      - name: line-count gate (500 lines/file)
        run: nix build .#cpp-line-count --print-build-logs
      - name: clang-tidy
        run: nix build .#cpp-tidy --print-build-logs

  codegen-drift:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      # Committed generated output must match what the generator emits from
      # the vendored schema + allowlist. Porcelain (not just diff) so newly
      # emitted-but-uncommitted files also fail.
      - name: Regenerate and diff
        run: |
          nix run .#codegen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is stale. Run: nix run .#codegen and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  resyntax:
    name: Resyntax lint
    runs-on: ubuntu-latest
    steps:
      # full history: --local-git-repository resolves the base ref locally,
      # and checkout's default shallow fetch would not have it
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      # The default dev shell provisions Resyntax into the user scope, so the
      # linter runs on the same nix-provided Racket as the rest of the build.
      - name: Resyntax lint
        env:
          # on a master push the empty diff against origin/master reports
          # quickly; a skipped required check never reports and stalls merges
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            # set -e would abort at the substitution, losing $out and the
            # ::error:: below
            rc=0
            out=$(resyntax analyze --local-git-repository . "$BASE_REF" \
                    --analyzer-timeout 30000 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::Resyntax exited $rc without completing the analysis."
              exit 1
            fi
            if echo "$out" | grep -qE "resyntax: .*\.rkt:[0-9]+:[0-9]+ \["; then
              echo "::error::Resyntax found refactoring suggestions. Run: resyntax fix --local-git-repository . $BASE_REF"
              exit 1
            fi
            timeouts=$(echo "$out" | grep -c "timed out" || true)
            if [ "$timeouts" -gt 0 ]; then
              echo "::warning::Resyntax analyzer timed out on $timeouts file(s); that part of the analysis was partial."
            fi
            echo "Resyntax: no suggestions."
          '
