# Automatic Claude Code review on pull requests targeting master.
# Authenticates with a Claude subscription (Pro/Max) OAuth token so reviews
# draw on the account's token budget rather than API billing: run
# `claude setup-token` locally, then store the result as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings > Secrets and
# variables > Actions). Posts findings as PR comments / inline annotations.
#
# A pull request is reviewed in full until a review run succeeds on it;
# after that each push is reviewed incrementally from the head that run
# covered, against the earlier threads and their replies (see
# .github/scripts/review_context.py). A push that only merges the base
# branch is not reviewed.

name: claude-code-review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      # full history: the incremental range and the base branch must resolve
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/review_context.py .review-context

      - name: Run Claude Code review
        if: steps.context.outputs.mode != 'none'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Start with .review-context/context.md. It says whether this is
            a full review of the pull request or an incremental review of
            one push. For an incremental review, review only
            .review-context/changes.patch and comment only on lines it
            changes; the rest of the pull request was reviewed before.

            .review-context/threads.md holds every earlier review thread
            on this pull request, resolved or open, with the replies. Do
            not open a thread on a point already raised there unless this
            push changes the code it concerns. If you still disagree with
            a reply, say why in your summary comment, not in a new inline
            thread.

            This repository is torchrkt: Racket bindings to libtorch via a
            hand-written extern "C" shim. Read AGENTS.md first for the
            project's conventions, then review the diff for:
            - correctness bugs (memory ownership across the FFI boundary,
              the integer-status + tr_last_error contract, GC finalizer
              registration on tensor-returning bindings)
            - violations of repo conventions (files <= 500 lines, ops.cpp
              boundary helpers in detail/op_call.hpp, allocator-wrapped raw
              bindings, contracts at the definition site, the
              name-shadowing dispatch convention)
            - missing test or parity coverage for new ops (gtest goldens,
              example triples, generated-parity-test recipes for allowlist
              ops, python-cross-test checks for hand-written ops)

            Report genuine issues only: name the input or state that goes
            wrong and what happens. Do not restate the diff or praise
            style. Use inline comments for line-specific findings and a
            single summary comment for overall feedback.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Grep,Glob"
