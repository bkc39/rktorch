# Automatic Claude Code review of every pull request, each layer of a stack
# against its own base branch. Authenticates with a Claude subscription
# (Pro/Max) OAuth token so reviews draw on the account's token budget rather
# than API billing: run `claude setup-token` locally, then store the result
# as the CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings > Secrets and
# variables > Actions). Posts findings as PR comments / inline annotations.
#
# GitHub runs the copy of this file in the pull request's merge ref (its head
# merged into its base), and the action skips the review, the job still
# green, unless that copy is master's: a stacked layer is reviewed once its
# base has merged master's copy. A run counts as a review only when it
# uploads the reviewed-<number> artifact. The context script and the prompt
# come from master, so no pull request changes how it is itself reviewed.

name: claude-code-review

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  actions: read
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      # full history: the incremental range and the base branch must resolve
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          git show "origin/$DEFAULT_BRANCH:.github/scripts/review_context.py" \
            > "$RUNNER_TEMP/review_context.py"
          python3 "$RUNNER_TEMP/review_context.py" .review-context

      - name: Run Claude Code review
        id: review
        if: steps.context.outputs.mode == 'full' || steps.context.outputs.mode == 'incremental'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.context.outputs.prompt }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Grep,Glob"

      - name: Record review
        if: steps.context.outputs.record != '' && (steps.context.outputs.mode == 'none' || steps.review.outputs.conclusion == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.context.outputs.record }}
          path: |
            .review-context/context.md
            .review-context/record.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90
