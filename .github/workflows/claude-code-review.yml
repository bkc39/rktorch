# Automatic Claude Code review of every pull request, each layer of a stack
# included, against its own base branch. Authenticates with a Claude
# subscription (Pro/Max) OAuth token so reviews draw on the account's token
# budget rather than API billing: run `claude setup-token` locally, then
# store the result as the CLAUDE_CODE_OAUTH_TOKEN repository secret
# (Settings > Secrets and variables > Actions). Posts findings as PR
# comments / inline annotations.
#
# A pull request is reviewed in full until a review has run on it, then each
# push incrementally from the head that review covered, against the earlier
# threads and their replies; a push that only merges its base or master is
# not reviewed (.github/scripts/review_context.py, which also names the
# stack). The action skips the review while this file differs from master's,
# so only a run that reaches "Record review" counts as one.

name: claude-code-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: read
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      # full history: the incremental range and the base branch must resolve
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/review_context.py .review-context

      - name: Run Claude Code review
        id: review
        if: steps.context.outputs.mode != 'none'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.context.outputs.prompt }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Grep,Glob"

      - name: Record review
        if: steps.context.outputs.mode == 'none' || steps.review.outputs.conclusion == 'success'
        run: echo "reviewed through ${{ github.event.pull_request.head.sha }}"
