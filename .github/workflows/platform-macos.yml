name: macOS platform package

on:
  pull_request:
    paths:
      - "cpp/**"
      - "scripts/platform/**"
      - "pkgs/**"
      - "torch/info.rkt"
      - "torch/pkg-build/**"
      - "torch/private/install-torchrkt-native.rkt"
      - "torch/foreign/raw/**"
      - "torch/tests/native-library-test.rkt"
      - "torch/tests/tensor-ops-test.rkt"
      - "torch/tests/autograd-test.rkt"
      - "torch/tests/nn-test.rkt"
      - ".github/workflows/platform-macos.yml"
      - ".github/workflows/platform-macos-build.yml"
      - "!scripts/platform/linux/**"
      - "!pkgs/torch-x86_64-linux/**"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      mps:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/platform-macos-build.yml

  install:
    name: install (macOS 14, Racket 9.1 and 9.3)
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OUT: ${{ github.workspace }}/.scratch/macos/out
      RACKETS: ${{ github.workspace }}/.scratch/macos/racket
      SMOKE_TESTS: torch/tests/native-library-test torch/tests/tensor-ops-test torch/tests/autograd-test
    steps:
      - uses: actions/checkout@v5

      - name: Host
        run: |
          mkdir -p "$OUT/logs" "$RACKETS"
          sw_vers
          uname -m
          sysctl -n hw.ncpu hw.memsize

      - name: Cache the Racket installers
        uses: actions/cache@v4
        with:
          path: .scratch/macos/racket/dl
          key: platform-macos-racket-install-${{ hashFiles('scripts/platform/sources.txt') }}

      - name: Download the macOS package
        uses: actions/download-artifact@v4
        with:
          name: torch-aarch64-macosx
          path: .scratch/macos

      - name: Racket 9.1
        run: scripts/platform/macos/install-racket.sh 9.1 "$RACKETS/9.1" "$RACKETS/dl"

      - name: Catalog
        id: catalog
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.1/bin:$PATH"
          scripts/platform/catalog.sh "$OUT/pkg/torch-aarch64-macosx.zip" "$OUT/catalog" "$OUT/catalog"

      - name: The CPU suites, Racket 9.1
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.1/bin:$PATH" SMOKE_HOME="$RACKETS/home-9.1"
          scripts/platform/smoke-install.sh "$OUT/catalog" "macOS $(sw_vers -productVersion)" 2>&1 |
            tee "$OUT/logs/smoke-9.1.log"

      - name: Racket 9.3
        id: racket-9-3
        if: (success() || failure()) && steps.catalog.outcome == 'success'
        run: scripts/platform/macos/install-racket.sh 9.3 "$RACKETS/9.3" "$RACKETS/dl"

      - name: The CPU suites, Racket 9.3
        if: (success() || failure()) && steps.racket-9-3.outcome == 'success'
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.3/bin:$PATH" SMOKE_HOME="$RACKETS/home-9.3"
          scripts/platform/smoke-install.sh "$OUT/catalog" "macOS $(sw_vers -productVersion)" 2>&1 |
            tee "$OUT/logs/smoke-9.3.log"

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torch-aarch64-macosx-install
          if-no-files-found: warn
          path: .scratch/macos/out/logs/

  mps:
    name: MPS tests (Racket 9.3)
    needs: build
    if: >-
      inputs.mps || (github.workflow == 'macOS platform package'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OUT: ${{ github.workspace }}/.scratch/macos/out
      RACKETS: ${{ github.workspace }}/.scratch/macos/racket
    steps:
      - uses: actions/checkout@v5

      - name: Host
        run: |
          mkdir -p "$OUT/logs" "$RACKETS"
          sw_vers
          uname -m
          sysctl -n hw.ncpu hw.memsize

      - name: Cache the Racket installers
        uses: actions/cache@v4
        with:
          path: .scratch/macos/racket/dl
          key: platform-macos-racket-mps-${{ hashFiles('scripts/platform/sources.txt') }}

      - name: Download the macOS package
        uses: actions/download-artifact@v4
        with:
          name: torch-aarch64-macosx
          path: .scratch/macos

      - name: Racket 9.3
        run: scripts/platform/macos/install-racket.sh 9.3 "$RACKETS/9.3" "$RACKETS/dl"

      - name: Catalog
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.3/bin:$PATH"
          scripts/platform/catalog.sh "$OUT/pkg/torch-aarch64-macosx.zip" "$OUT/catalog" "$OUT/catalog"

      - name: Install and smoke
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.3/bin:$PATH" SMOKE_HOME="$RACKETS/home-9.3"
          scripts/platform/smoke-install.sh "$OUT/catalog" "macOS $(sw_vers -productVersion)" 2>&1 |
            tee "$OUT/logs/smoke-9.3.log"

      - name: The installed package's MPS tests
        run: |
          set -euo pipefail
          export PATH="$RACKETS/9.3/bin:$PATH" PLTUSERHOME="$RACKETS/home-9.3"
          racket -l racket/base -l torch -e '(unless (mps-available?) (error "mps-available? is #f"))'
          raco test -l torch/tests/device-test torch/tests/to-test \
            torch/tests/audio-device-test torch/tests/mps-pressure-paths-test 2>&1 |
            tee "$OUT/logs/mps-tests.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torch-aarch64-macosx-mps
          if-no-files-found: warn
          path: .scratch/macos/out/logs/
